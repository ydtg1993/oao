<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oao — Demo</title>
    <link rel="stylesheet" href="/preview.css">
    <link rel="stylesheet" href="/static/oao/oao.css">
    <link rel="stylesheet" href="/static/oao/oao-charts.css">
    <link rel="stylesheet" href="/static/oao/oao-motion.css">
    <style>.demo-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.demo-chart{min-width:0;padding:20px;background:var(--card,#fff);border:2px solid var(--border-color,#111)}@media(max-width:720px){.demo-charts{grid-template-columns:1fr}}</style>
</head>
<body>
<div id="app"></div>
<script src="/static/oao/oao.js"></script>
<script src="/static/oao/oao-motion.js"></script>
<script src="/static/oao/oao-charts.js"></script>
<script>
    // 演示 Oao.mount：外壳（侧边栏 + 内容区）由组件搭，
    // 宿主只给「自己的页面 + 两个插槽」。整个 demo 从 30 行缩到十几行。
    // 鉴权入口：headers 每次请求都回调一次（token 轮换跟得上）；
    // 收到 401 时问 onUnauthorized，返回 true 就带新凭据重试一次。
    Oao.init({
        base: '/api/oao',
        headers: function () {
            var token = localStorage.getItem('oao-token');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        },
        onUnauthorized: async function () {
            var t = prompt('访问凭据已失效，请重新输入：');
            if (!t) return false;
            localStorage.setItem('oao-token', t);
            return true;           // 已换好凭据，组件会重试一次
        }
    });

    Oao.mount(document.getElementById('app'), {
        title: 'OAO',

        // 右上角插槽：HTML 字符串，也可以传 (el, api) => void 自己挂事件
        headerRight: '<span class="badge info">demo</span>'
            + '<span class="oao-avatar">Y</span>',

        // 侧边栏底部插槽
        sidebarFooter: '<button class="oao-btn" id="theme">☾ 深色</button>',

        // 宿主自己的页面（不是 oao 表格），跟表格一起进菜单
        pages: [
            {
                key: 'visuals', label: '图表与动效', group: '概览',
                render: function (el, api) {
                    el.innerHTML = '<h2>图表与动效</h2><p>本地合成数据 · 支持键盘查看数值与展开数据表；离页释放图表。</p><p><button class="oao-btn" id="demo-change">更新样本</button> <button class="oao-btn" id="demo-motion">减弱动效</button></p><div class="demo-charts"><div class="demo-chart" id="demo-line"></div><div class="demo-chart" id="demo-bar"></div><div class="demo-chart" id="demo-donut"></div><div class="demo-chart" id="demo-spark"></div></div>';
                    var charts=[],step=0,now=Date.now();
                    function paint() {
                        var data=[{key:'a',label:'分类 A',value:12+step},{key:'b',label:'分类 B',value:5},{key:'c',label:'分类 C',value:2}];
                        var options=[
                            {type:'line',title:'折线 · 真实时间间隔与断点',xType:'time',unit:'项',series:[{key:'a',label:'观测',points:[{x:now,y:-2},{x:now+3000,y:4},{x:now+6000,y:null},{x:now+12000,y:12+step}]}]},
                            {type:'bar',title:'横向柱形',horizontal:true,unit:'项',data:data},
                            {type:'donut',title:'环形分布',unit:'项',data:data},
                            {type:'sparkline',title:'迷你趋势',unit:'%',series:[{key:'a',label:'占比',points:[{x:0,y:10},{x:1,y:20},{x:2,y:5},{x:3,y:32+step}]}]}
                        ];
                        ['line','bar','donut','spark'].forEach(function (key,i) { if(charts[i])charts[i].update(options[i]);else charts[i]=Oao.charts.create(el.querySelector('#demo-'+key),options[i]); });
                    }
                    paint();
                    el.querySelector('#demo-change').onclick=function(){step=(step+3)%18;paint();};
                    el.querySelector('#demo-motion').onclick=function(){var reduce=Oao.motion.get()!=='reduced';Oao.motion.set(reduce?'reduced':'system');this.textContent=reduce?'跟随系统动效':'减弱动效';};
                    return function(){charts.forEach(function(chart){chart.destroy();});};
                }
            },
            {
                key: 'welcome', label: '首页', group: '概览',
                render: function (el, api) {
                    el.innerHTML = '<div class="card"><h2>这是宿主自己的页面</h2>'
                        + '<p>由 <code>pages[].render(el, api)</code> 渲染，跟 oao 表格共用同一套外壳。</p>'
                        + '<p>api 提供 <code>open(key, opts)</code> / <code>reload()</code> / <code>current()</code>。</p>'
                        + '<button class="oao-btn" id="go">跳到「订单管理」</button>'
                        + '<button class="oao-btn" id="filtered" style="margin-left:8px">带预置筛选打开（只看「通过」）</button></div>';
                    el.querySelector('#go').onclick = function () { api.open('order'); };
                    // 预置筛选：open/render 的 opts.filter —— 打开时筛选栏里就填好了「状态=通过」，
                    // 用户能改能清（是"帮你填好"，不是"锁上"）。
                    el.querySelector('#filtered').onclick = function () {
                        api.open('order', { filter: { status: '2' } });
                    };
                }
            },
        ],

        onReady: function (api) {
            var themes = ['light', 'dark'], i = 0;
            document.getElementById('theme').onclick = function () {
                i = (i + 1) % 2;
                document.documentElement.setAttribute('data-theme', themes[i]);
                this.textContent = themes[i] === 'dark' ? '☀ 浅色' : '☾ 深色';
            };
            console.log('布局就绪，当前页:', api.current());
        }
    });
</script>
</body>
</html>
